<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 贪吃蛇</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .score-box {
            background: #16213e;
            color: #e94560;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.2);
        }

        .score-box span {
            color: #fff;
            font-size: 28px;
        }

        .high-score-box {
            background: #16213e;
            color: #f5c518;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(245, 197, 24, 0.2);
        }

        .high-score-box span {
            color: #fff;
            font-size: 28px;
        }

        canvas {
            display: block;
            border-radius: 12px;
            box-shadow:
                0 0 30px rgba(233, 69, 96, 0.15),
                0 0 60px rgba(233, 69, 96, 0.05);
            background: #0f3460;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            background: #16213e;
            color: #e94560;
            border: 2px solid #e94560;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #e94560;
            color: #fff;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.3);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .speed-indicator {
            color: #888;
            font-size: 14px;
            margin-top: 16px;
            letter-spacing: 1px;
        }

        .speed-indicator span {
            color: #0f9b8e;
            font-weight: 700;
        }

        /* 移动端虚拟方向键 */
        .mobile-controls {
            display: none;
            margin-top: 20px;
            user-select: none;
        }

        .dpad {
            display: grid;
            grid-template-columns: 70px 70px 70px;
            grid-template-rows: 70px 70px 70px;
            gap: 4px;
            justify-content: center;
        }

        .dpad-btn {
            background: #16213e;
            color: #e94560;
            border: 2px solid #334;
            border-radius: 10px;
            font-size: 26px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active {
            background: #e94560;
            color: #fff;
        }

        .dpad-center {
            background: transparent;
            border: none;
        }

        @media (max-width: 520px) {
            .mobile-controls {
                display: block;
            }

            canvas {
                max-width: 95vw;
                max-height: 50vh;
            }

            .btn {
                padding: 8px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="score-box">🍎 得分 <span id="score">0</span></div>
            <div class="high-score-box">🏆 最高 <span id="highScore">0</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <button class="btn" id="btnStart">🎮 开始 / 暂停</button>
            <button class="btn" id="btnRestart">🔄 重新开始</button>
            <button class="btn" id="btnSpeed">⚡ 速度: <span id="speedLabel">普通</span></button>
            <button class="btn" id="btnWall">🧱 穿墙: <span id="wallLabel">开</span></button>
        </div>

        <div class="mobile-controls">
            <div class="dpad">
                <div></div>
                <button class="dpad-btn" id="btnUp">▲</button>
                <div></div>
                <button class="dpad-btn" id="btnLeft">◀</button>
                <div class="dpad-center"></div>
                <button class="dpad-btn" id="btnRight">▶</button>
                <div></div>
                <button class="dpad-btn" id="btnDown">▼</button>
                <div></div>
            </div>
        </div>

        <div class="speed-indicator">使用 <span>方向键 / WASD</span> 控制方向 | <span>空格</span> 暂停</div>
    </div>

    <script>
        (function () {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreEl = document.getElementById('score');
            const highScoreEl = document.getElementById('highScore');
            const speedLabel = document.getElementById('speedLabel');
            const wallLabel = document.getElementById('wallLabel');

            // ---- 配置 ----
            const GRID_SIZE = 20;       // 每格像素
            const COLS = 20;            // 列数
            const ROWS = 20;            // 行数
            canvas.width = COLS * GRID_SIZE;
            canvas.height = ROWS * GRID_SIZE;

            // 速度档位（ms/帧）
            const SPEEDS = [
                { label: '慢速', value: 150 },
                { label: '普通', value: 100 },
                { label: '快速', value: 60 },
                { label: '极速', value: 35 },
            ];

            // ---- 状态 ----
            let snake = [];
            let food = { x: 0, y: 0 };
            let specialFood = null;          // 特殊食物（金色，+3分）
            let specialFoodTimer = 0;
            let direction = { x: 1, y: 0 };
            let nextDirection = { x: 1, y: 0 };
            let score = 0;
            let highScore = 0;
            let gameLoop = null;
            let running = false;
            let gameOver = false;
            let speedIndex = 1;             // 默认「普通」
            let wrapWall = true;            // 默认穿墙
            let particles = [];             // 粒子特效

            // 读取历史最高分
            try {
                highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
                highScoreEl.textContent = highScore;
            } catch (e) { /* ignore */ }

            // ---- 初始化 ----
            function initGame() {
                const startX = Math.floor(COLS / 2);
                const startY = Math.floor(ROWS / 2);
                snake = [
                    { x: startX, y: startY },
                    { x: startX - 1, y: startY },
                    { x: startX - 2, y: startY },
                ];
                direction = { x: 1, y: 0 };
                nextDirection = { x: 1, y: 0 };
                score = 0;
                gameOver = false;
                specialFood = null;
                specialFoodTimer = 0;
                particles = [];
                scoreEl.textContent = '0';
                placeFood();
            }

            // ---- 食物 ----
            function randomPos() {
                return {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS),
                };
            }

            function isOnSnake(pos, skipHead) {
                const arr = skipHead ? snake.slice(1) : snake;
                return arr.some(seg => seg.x === pos.x && seg.y === pos.y);
            }

            function placeFood() {
                let pos;
                do {
                    pos = randomPos();
                } while (isOnSnake(pos, false));
                food = pos;
            }

            function placeSpecialFood() {
                if (specialFood) return;
                let pos;
                do {
                    pos = randomPos();
                } while (
                    isOnSnake(pos, false) ||
                    (pos.x === food.x && pos.y === food.y)
                );
                specialFood = pos;
                specialFoodTimer = 80; // 80 帧后消失
            }

            // ---- 粒子 ----
            function spawnParticles(x, y, color, count) {
                for (let i = 0; i < count; i++) {
                    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
                    const speed = 1.5 + Math.random() * 3;
                    particles.push({
                        x: x * GRID_SIZE + GRID_SIZE / 2,
                        y: y * GRID_SIZE + GRID_SIZE / 2,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        decay: 0.02 + Math.random() * 0.04,
                        color: color,
                        size: 2 + Math.random() * 3,
                    });
                }
            }

            function updateParticles() {
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    if (p.life <= 0) particles.splice(i, 1);
                }
            }

            function drawParticles() {
                for (const p of particles) {
                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            // ---- 游戏逻辑 ----
            function tick() {
                if (!running || gameOver) return;

                direction = { ...nextDirection };
                const head = {
                    x: snake[0].x + direction.x,
                    y: snake[0].y + direction.y,
                };

                // 穿墙处理
                if (wrapWall) {
                    head.x = ((head.x % COLS) + COLS) % COLS;
                    head.y = ((head.y % ROWS) + ROWS) % ROWS;
                }

                // 撞墙检测
                if (!wrapWall) {
                    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                        return endGame();
                    }
                }

                // 撞自己检测
                if (isOnSnake(head, false)) {
                    return endGame();
                }

                snake.unshift({ ...head });

                // 吃普通食物
                let ate = false;
                if (head.x === food.x && head.y === food.y) {
                    score += 1;
                    ate = true;
                    spawnParticles(food.x, food.y, '#e94560', 12);
                    placeFood();
                    // 每吃 5 个出现特殊食物
                    if (score % 5 === 0) {
                        placeSpecialFood();
                    }
                } else if (
                    specialFood &&
                    head.x === specialFood.x &&
                    head.y === specialFood.y
                ) {
                    score += 3;
                    ate = true;
                    spawnParticles(specialFood.x, specialFood.y, '#f5c518', 20);
                    specialFood = null;
                    specialFoodTimer = 0;
                } else {
                    snake.pop(); // 没吃到就去尾
                }

                // 特殊食物计时
                if (specialFood) {
                    specialFoodTimer--;
                    if (specialFoodTimer <= 0) {
                        specialFood = null;
                        specialFoodTimer = 0;
                    }
                }

                // 吃普通食物后概率出特殊食物
                if (ate && !specialFood && Math.random() < 0.1) {
                    placeSpecialFood();
                }

                scoreEl.textContent = score;
                updateParticles();
                draw();
            }

            function endGame() {
                gameOver = true;
                running = false;
                if (gameLoop) {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    try {
                        localStorage.setItem('snakeHighScore', highScore);
                    } catch (e) { /* ignore */ }
                }
                // 死亡粒子
                const head = snake[0];
                spawnParticles(head.x, head.y, '#fff', 30);
                draw();
                drawGameOverOverlay();
            }

            function startGame() {
                if (gameOver) {
                    initGame();
                }
                running = !running;
                if (running) {
                    const speed = SPEEDS[speedIndex].value;
                    gameLoop = setInterval(tick, speed);
                } else {
                    clearInterval(gameLoop);
                    gameLoop = null;
                }
                updateStartButton();
            }

            function restartGame() {
                clearInterval(gameLoop);
                gameLoop = null;
                running = false;
                initGame();
                updateStartButton();
                draw();
            }

            function updateStartButton() {
                const btn = document.getElementById('btnStart');
                btn.textContent = running ? '⏸ 暂停' : '🎮 开始';
            }

            // ---- 绘制 ----
            function drawGrid() {
                ctx.strokeStyle = 'rgba(255,255,255,0.03)';
                ctx.lineWidth = 0.5;
                for (let x = 0; x <= COLS; x++) {
                    ctx.beginPath();
                    ctx.moveTo(x * GRID_SIZE, 0);
                    ctx.lineTo(x * GRID_SIZE, ROWS * GRID_SIZE);
                    ctx.stroke();
                }
                for (let y = 0; y <= ROWS; y++) {
                    ctx.beginPath();
                    ctx.moveTo(0, y * GRID_SIZE);
                    ctx.lineTo(COLS * GRID_SIZE, y * GRID_SIZE);
                    ctx.stroke();
                }
            }

            function drawSnake() {
                const len = snake.length;
                snake.forEach((seg, i) => {
                    const t = len > 1 ? i / (len - 1) : 0;
                    // 头部亮红，尾部渐变暗
                    const r = Math.floor(233 - t * 180);
                    const g = Math.floor(69 + t * 50);
                    const b = Math.floor(96 - t * 70);
                    ctx.fillStyle = `rgb(${r},${g},${b})`;

                    const pad = 1;
                    const x = seg.x * GRID_SIZE + pad;
                    const y = seg.y * GRID_SIZE + pad;
                    const size = GRID_SIZE - pad * 2;
                    const radius = i === 0 ? 6 : 4;

                    ctx.beginPath();
                    ctx.roundRect(x, y, size, size, radius);
                    ctx.fill();

                    // 头部加眼睛
                    if (i === 0) {
                        ctx.fillStyle = '#fff';
                        const eyeR = 2.5;
                        let ex1, ey1, ex2, ey2;
                        const cx = seg.x * GRID_SIZE + GRID_SIZE / 2;
                        const cy = seg.y * GRID_SIZE + GRID_SIZE / 2;

                        if (direction.x === 1) {
                            ex1 = cx + 3; ey1 = cy - 4;
                            ex2 = cx + 3; ey2 = cy + 4;
                        } else if (direction.x === -1) {
                            ex1 = cx - 3; ey1 = cy - 4;
                            ex2 = cx - 3; ey2 = cy + 4;
                        } else if (direction.y === -1) {
                            ex1 = cx - 4; ey1 = cy - 3;
                            ex2 = cx + 4; ey2 = cy - 3;
                        } else {
                            ex1 = cx - 4; ey1 = cy + 3;
                            ex2 = cx + 4; ey2 = cy + 3;
                        }

                        ctx.beginPath();
                        ctx.arc(ex1, ey1, eyeR, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex2, ey2, eyeR, 0, Math.PI * 2);
                        ctx.fill();

                        // 瞳孔
                        ctx.fillStyle = '#111';
                        ctx.beginPath();
                        ctx.arc(ex1, ey1, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(ex2, ey2, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            }

            function drawFood() {
                // 普通食物 - 红苹果
                const fx = food.x * GRID_SIZE + GRID_SIZE / 2;
                const fy = food.y * GRID_SIZE + GRID_SIZE / 2;
                const r = GRID_SIZE / 2 - 2;

                // 光晕
                ctx.fillStyle = 'rgba(233,69,96,0.3)';
                ctx.beginPath();
                ctx.arc(fx, fy, r + 2, 0, Math.PI * 2);
                ctx.fill();

                // 主体
                const gradient = ctx.createRadialGradient(fx - 2, fy - 2, 1, fx, fy, r);
                gradient.addColorStop(0, '#ff6b7f');
                gradient.addColorStop(1, '#e94560');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(fx, fy, r, 0, Math.PI * 2);
                ctx.fill();

                // 高光
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(fx - 2, fy - 3, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // 梗
                ctx.strokeStyle = '#4a7c3f';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(fx, fy - r + 1);
                ctx.lineTo(fx + 1, fy - r - 3);
                ctx.stroke();

                // 特殊食物 - 金色星星
                if (specialFood) {
                    const sx = specialFood.x * GRID_SIZE + GRID_SIZE / 2;
                    const sy = specialFood.y * GRID_SIZE + GRID_SIZE / 2;

                    // 闪烁效果
                    const blink = specialFoodTimer < 20 ? (specialFoodTimer % 4 < 2 ? 1 : 0.3) : 1;

                    ctx.save();
                    ctx.globalAlpha = blink;

                    ctx.fillStyle = 'rgba(245,197,24,0.3)';
                    ctx.beginPath();
                    ctx.arc(sx, sy, r + 4, 0, Math.PI * 2);
                    ctx.fill();

                    const grad2 = ctx.createRadialGradient(sx - 1, sy - 1, 1, sx, sy, r);
                    grad2.addColorStop(0, '#ffe082');
                    grad2.addColorStop(1, '#f5c518');
                    ctx.fillStyle = grad2;

                    // 五角星
                    drawStar(sx, sy, r, r * 0.45, 5);
                    ctx.fill();

                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.beginPath();
                    ctx.arc(sx - 1, sy - 2, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                }
            }

            function drawStar(cx, cy, outerR, innerR, points) {
                ctx.beginPath();
                for (let i = 0; i < points * 2; i++) {
                    const r = i % 2 === 0 ? outerR : innerR;
                    const angle = (Math.PI * 2 * i) / (points * 2) - Math.PI / 2;
                    const x = cx + Math.cos(angle) * r;
                    const y = cy + Math.sin(angle) * r;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
            }

            function drawGameOverOverlay() {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 32px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 16);

                ctx.fillStyle = '#e94560';
                ctx.font = '18px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillText(`得分: ${score}`, canvas.width / 2, canvas.height / 2 + 24);

                ctx.fillStyle = '#888';
                ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
                ctx.fillText('按「开始」再来一局', canvas.width / 2, canvas.height / 2 + 52);

                ctx.textAlign = 'start';
            }

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 背景渐变
                const bg = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                bg.addColorStop(0, '#0f3460');
                bg.addColorStop(1, '#16213e');
                ctx.fillStyle = bg;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                drawGrid();
                drawFood();
                drawSnake();
                drawParticles();

                if (gameOver) {
                    drawGameOverOverlay();
                } else if (!running && snake.length > 0) {
                    // 暂停 / 初始状态
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 24px "PingFang SC","Microsoft YaHei",sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('按「开始」游戏', canvas.width / 2, canvas.height / 2);
                    ctx.textAlign = 'start';
                }
            }

            // ---- 事件处理 ----
            function changeDirection(dx, dy) {
                if (!running || gameOver) return;
                // 防止反向
                if (dx !== 0 && dx === -direction.x && dy === direction.y) return;
                if (dy !== 0 && dy === -direction.y && dx === direction.x) return;
                nextDirection = { x: dx, y: dy };
            }

            document.addEventListener('keydown', (e) => {
                switch (e.key) {
                    case 'ArrowUp':
                    case 'w':
                    case 'W':
                        e.preventDefault();
                        changeDirection(0, -1);
                        break;
                    case 'ArrowDown':
                    case 's':
                    case 'S':
                        e.preventDefault();
                        changeDirection(0, 1);
                        break;
                    case 'ArrowLeft':
                    case 'a':
                    case 'A':
                        e.preventDefault();
                        changeDirection(-1, 0);
                        break;
                    case 'ArrowRight':
                    case 'd':
                    case 'D':
                        e.preventDefault();
                        changeDirection(1, 0);
                        break;
                    case ' ':
                        e.preventDefault();
                        startGame();
                        break;
                }
            });

            // 移动端按键
            document.getElementById('btnUp').addEventListener('click', () => changeDirection(0, -1));
            document.getElementById('btnDown').addEventListener('click', () => changeDirection(0, 1));
            document.getElementById('btnLeft').addEventListener('click', () => changeDirection(-1, 0));
            document.getElementById('btnRight').addEventListener('click', () => changeDirection(1, 0));

            document.getElementById('btnStart').addEventListener('click', startGame);
            document.getElementById('btnRestart').addEventListener('click', restartGame);

            document.getElementById('btnSpeed').addEventListener('click', () => {
                speedIndex = (speedIndex + 1) % SPEEDS.length;
                speedLabel.textContent = SPEEDS[speedIndex].label;
                if (running) {
                    clearInterval(gameLoop);
                    gameLoop = setInterval(tick, SPEEDS[speedIndex].value);
                }
            });

            document.getElementById('btnWall').addEventListener('click', () => {
                wrapWall = !wrapWall;
                wallLabel.textContent = wrapWall ? '开' : '关';
            });

            // 触摸滑动支持
            let touchStartX = 0, touchStartY = 0;
            canvas.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            canvas.addEventListener('touchend', (e) => {
                const dx = e.changedTouches[0].clientX - touchStartX;
                const dy = e.changedTouches[0].clientY - touchStartY;
                if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
                if (Math.abs(dx) > Math.abs(dy)) {
                    changeDirection(dx > 0 ? 1 : -1, 0);
                } else {
                    changeDirection(0, dy > 0 ? 1 : -1);
                }
            });

            // ---- 启动 ----
            initGame();
            draw();
            updateStartButton();
        })();
    </script>
</body>
</html>
